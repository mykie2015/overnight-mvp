<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Intent Engine - Interactive Force Graph</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            overflow: hidden;
            touch-action: none;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }
        
        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            pointer-events: auto;
        }
        
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            font-size: 0.9em;
            color: #a0aec0;
        }
        
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 31, 58, 0.95);
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 16px;
            padding: 20px;
            max-width: 90%;
            width: 400px;
            color: white;
            pointer-events: auto;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .info-panel.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
        }
        
        .info-panel h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .info-panel p {
            color: #a0aec0;
            line-height: 1.6;
            font-size: 0.95em;
            margin-bottom: 10px;
        }
        
        .info-panel ul {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }
        
        .info-panel li {
            color: #a0aec0;
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
            font-size: 0.9em;
        }
        
        .info-panel li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: #667eea;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(102, 126, 234, 0.3);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .instructions {
            position: absolute;
            top: 100px;
            left: 20px;
            background: rgba(26, 31, 58, 0.9);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 0.85em;
            max-width: 250px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        
        .instructions h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1em;
        }
        
        .instructions p {
            color: #a0aec0;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        
        .legend {
            position: absolute;
            top: 100px;
            right: 20px;
            background: rgba(26, 31, 58, 0.9);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 0.85em;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        
        .legend h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1em;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .legend-label {
            color: #a0aec0;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }
            
            .instructions, .legend {
                font-size: 0.75em;
                max-width: 150px;
                padding: 10px;
            }
            
            .info-panel {
                width: 90%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="overlay">
        <div class="header">
            <h1>⚡ Intent Engine</h1>
            <p>Interactive Force Graph</p>
        </div>
        
        <div class="instructions">
            <h4>🎮 Controls</h4>
            <p><strong>Tap</strong> nodes to see details</p>
            <p><strong>Drag</strong> to pan around</p>
            <p><strong>Pinch</strong> to zoom in/out</p>
            <p><strong>Double-tap</strong> to reset view</p>
        </div>
        
        <div class="legend">
            <h4>🎨 Node Types</h4>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #667eea, #764ba2);"></div>
                <div class="legend-label">Core</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #10b981;"></div>
                <div class="legend-label">Input</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #f59e0b;"></div>
                <div class="legend-label">Process</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #3b82f6;"></div>
                <div class="legend-label">Output</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ef4444;"></div>
                <div class="legend-label">Guardrail</div>
            </div>
        </div>
        
        <div class="info-panel hidden" id="infoPanel">
            <button class="close-btn" onclick="closeInfo()">×</button>
            <h3 id="infoTitle">Node Title</h3>
            <p id="infoDesc">Node description</p>
            <ul id="infoList"></ul>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Graph data
        const nodes = [
            // Core
            { id: 'core', label: 'Intent\nEngine', type: 'core', size: 60, color: '#667eea', 
              desc: 'Central orchestration system that transforms intents into production agents.',
              details: ['One command execution', 'Zero manual coding', '100% intent preservation', 'Infinite agent generation'] },
            
            // Input layer
            { id: 'objective', label: 'Objective', type: 'input', size: 40, color: '#10b981',
              desc: 'Defines WHY the agent exists and what problem it solves.',
              details: ['Guides decision-making', 'Provides context for edge cases', 'Explains business value'] },
            { id: 'outcomes', label: 'Outcomes', type: 'input', size: 40, color: '#10b981',
              desc: 'Observable states that indicate success (2-4 measurable outcomes).',
              details: ['From user perspective', 'Measurable states', 'Not activities'] },
            { id: 'context', label: 'Strategic\nContext', type: 'input', size: 40, color: '#10b981',
              desc: 'Business, technical, and user environment the agent operates in.',
              details: ['Business constraints', 'Technical environment', 'User expectations'] },
            { id: 'constraints', label: 'Constraints', type: 'input', size: 40, color: '#10b981',
              desc: 'Steering (prompt) and Hard (code) boundaries for agent behavior.',
              details: ['Steering: guide thinking', 'Hard: enforce in code', 'Non-negotiable limits'] },
            
            // Process layer
            { id: 'validate', label: 'Validate', type: 'process', size: 40, color: '#f59e0b',
              desc: '7 validation rules check intent structure and quality.',
              details: ['Structure check', 'Quality check', 'Completeness check', 'Outcome validation'] },
            { id: 'parse', label: 'Parse', type: 'process', size: 40, color: '#f59e0b',
              desc: 'Extract structured data from Context Capsule markdown.',
              details: ['Section extraction', 'List parsing', 'Constraint separation'] },
            { id: 'generate', label: 'Generate', type: 'process', size: 40, color: '#f59e0b',
              desc: 'Create LangChain agent code with embedded guardrails.',
              details: ['Code generation', 'Guardrail embedding', 'Prompt construction'] },
            
            // Output layer
            { id: 'agent', label: 'Production\nAgent', type: 'output', size: 40, color: '#3b82f6',
              desc: 'Fully functional LangChain agent with Claude Sonnet LLM.',
              details: ['ReAct reasoning', 'Intent-aware prompts', 'Error handling', 'Monitoring'] },
            { id: 'llm', label: 'Claude\nSonnet', type: 'output', size: 35, color: '#3b82f6',
              desc: 'Anthropic Claude Sonnet 4.5 language model.',
              details: ['Advanced reasoning', 'Tool use', 'Context awareness'] },
            { id: 'tools', label: 'Tools', type: 'output', size: 35, color: '#3b82f6',
              desc: 'LangChain tools for agent actions.',
              details: ['Custom tools', 'API integrations', 'Function calling'] },
            
            // Guardrails
            { id: 'g1', label: 'Objective\nPrompts', type: 'guardrail', size: 30, color: '#ef4444',
              desc: 'Embeds objective in agent prompts for context-aware decisions.',
              details: ['WHY awareness', 'Edge case guidance'] },
            { id: 'g2', label: 'Steering', type: 'guardrail', size: 30, color: '#ef4444',
              desc: 'Soft boundaries in prompt layer guide agent thinking.',
              details: ['Prompt-level guidance', 'Trade-off direction'] },
            { id: 'g3', label: 'Hard\nConstraints', type: 'guardrail', size: 30, color: '#ef4444',
              desc: 'Non-negotiable boundaries enforced in code.',
              details: ['Code enforcement', 'Cannot be bypassed'] },
            { id: 'g4', label: 'Decision\nBoundaries', type: 'guardrail', size: 30, color: '#ef4444',
              desc: 'Clear separation of autonomous vs escalation decisions.',
              details: ['Autonomous actions', 'Escalation triggers'] },
            { id: 'g5', label: 'Stop\nRules', type: 'guardrail', size: 30, color: '#ef4444',
              desc: 'Complete/escalate/halt conditions prevent runaway behavior.',
              details: ['Completion conditions', 'Escalation triggers', 'Emergency halt'] },
            { id: 'g6', label: 'Health\nMetrics', type: 'guardrail', size: 30, color: '#ef4444',
              desc: 'Non-regression constraints prevent quality degradation.',
              details: ['Quality monitoring', 'Performance tracking'] },
            { id: 'g7', label: 'Escalation\nTriggers', type: 'guardrail', size: 30, color: '#ef4444',
              desc: 'Automatic detection of situations requiring human intervention.',
              details: ['Pre-flight checking', 'Human handoff'] }
        ];
        
        const links = [
            // Input to Core
            { source: 'objective', target: 'core' },
            { source: 'outcomes', target: 'core' },
            { source: 'context', target: 'core' },
            { source: 'constraints', target: 'core' },
            
            // Core to Process
            { source: 'core', target: 'validate' },
            { source: 'core', target: 'parse' },
            { source: 'core', target: 'generate' },
            
            // Process to Output
            { source: 'validate', target: 'agent' },
            { source: 'parse', target: 'agent' },
            { source: 'generate', target: 'agent' },
            
            // Agent to components
            { source: 'agent', target: 'llm' },
            { source: 'agent', target: 'tools' },
            
            // Guardrails to Agent
            { source: 'g1', target: 'agent' },
            { source: 'g2', target: 'agent' },
            { source: 'g3', target: 'agent' },
            { source: 'g4', target: 'agent' },
            { source: 'g5', target: 'agent' },
            { source: 'g6', target: 'agent' },
            { source: 'g7', target: 'agent' }
        ];
        
        // Initialize positions
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        
        nodes.forEach((node, i) => {
            if (node.id === 'core') {
                node.x = centerX;
                node.y = centerY;
            } else {
                const angle = (i / nodes.length) * Math.PI * 2;
                const radius = 200;
                node.x = centerX + Math.cos(angle) * radius;
                node.y = centerY + Math.sin(angle) * radius;
            }
            node.vx = 0;
            node.vy = 0;
        });
        
        // Physics simulation
        let offsetX = 0, offsetY = 0, scale = 1;
        let isDragging = false, dragStartX = 0, dragStartY = 0;
        let lastTouchDistance = 0;
        
        function applyForces() {
            const alpha = 0.3;
            
            // Spring forces for links
            links.forEach(link => {
                const source = nodes.find(n => n.id === link.source);
                const target = nodes.find(n => n.id === link.target);
                
                const dx = target.x - source.x;
                const dy = target.y - source.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const targetDistance = 150;
                
                const force = (distance - targetDistance) * 0.1;
                const fx = (dx / distance) * force;
                const fy = (dy / distance) * force;
                
                source.vx += fx * alpha;
                source.vy += fy * alpha;
                target.vx -= fx * alpha;
                target.vy -= fy * alpha;
            });
            
            // Repulsion between nodes
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const a = nodes[i];
                    const b = nodes[j];
                    
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 200) {
                        const force = 1000 / (distance * distance);
                        const fx = (dx / distance) * force;
                        const fy = (dy / distance) * force;
                        
                        a.vx -= fx * alpha;
                        a.vy -= fy * alpha;
                        b.vx += fx * alpha;
                        b.vy += fy * alpha;
                    }
                }
            }
            
            // Center gravity for core node
            const core = nodes.find(n => n.id === 'core');
            const coreDx = centerX - core.x;
            const coreDy = centerY - core.y;
            core.vx += coreDx * 0.01;
            core.vy += coreDy * 0.01;
            
            // Update positions
            nodes.forEach(node => {
                node.x += node.vx;
                node.y += node.vy;
                node.vx *= 0.9;
                node.vy *= 0.9;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);
            
            // Draw links
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.3)';
            ctx.lineWidth = 2;
            links.forEach(link => {
                const source = nodes.find(n => n.id === link.source);
                const target = nodes.find(n => n.id === link.target);
                
                ctx.beginPath();
                ctx.moveTo(source.x, source.y);
                ctx.lineTo(target.x, target.y);
                ctx.stroke();
            });
            
            // Draw nodes
            nodes.forEach(node => {
                // Glow effect for core
                if (node.id === 'core') {
                    const gradient = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, node.size);
                    gradient.addColorStop(0, 'rgba(102, 126, 234, 0.8)');
                    gradient.addColorStop(0.5, 'rgba(118, 75, 162, 0.4)');
                    gradient.addColorStop(1, 'rgba(102, 126, 234, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, node.size * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Node circle
                const gradient = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, node.size);
                gradient.addColorStop(0, node.color);
                gradient.addColorStop(1, node.color + '99');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Border
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Label
                ctx.fillStyle = 'white';
                ctx.font = node.id === 'core' ? 'bold 16px sans-serif' : '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                const lines = node.label.split('\n');
                lines.forEach((line, i) => {
                    ctx.fillText(line, node.x, node.y + (i - lines.length / 2 + 0.5) * 14);
                });
            });
            
            ctx.restore();
        }
        
        function animate() {
            applyForces();
            draw();
            requestAnimationFrame(animate);
        }
        animate();
        
        // Touch/Mouse interaction
        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return {
                x: (touch.clientX - rect.left - offsetX) / scale,
                y: (touch.clientY - rect.top - offsetY) / scale
            };
        }
        
        function findNodeAt(x, y) {
            return nodes.find(node => {
                const dx = node.x - x;
                const dy = node.y - y;
                return Math.sqrt(dx * dx + dy * dy) < node.size;
            });
        }
        
        let lastTap = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
            } else {
                const now = Date.now();
                const pos = getEventPos(e);
                
                // Double tap to reset
                if (now - lastTap < 300) {
                    offsetX = 0;
                    offsetY = 0;
                    scale = 1;
                    closeInfo();
                } else {
                    // Single tap
                    const node = findNodeAt(pos.x, pos.y);
                    if (node) {
                        showInfo(node);
                    } else {
                        isDragging = true;
                        dragStartX = e.touches[0].clientX - offsetX;
                        dragStartY = e.touches[0].clientY - offsetY;
                    }
                }
                lastTap = now;
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            
            if (e.touches.length === 2) {
                // Pinch zoom
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (lastTouchDistance > 0) {
                    const delta = distance / lastTouchDistance;
                    scale *= delta;
                    scale = Math.max(0.5, Math.min(3, scale));
                }
                lastTouchDistance = distance;
            } else if (isDragging) {
                // Pan
                offsetX = e.touches[0].clientX - dragStartX;
                offsetY = e.touches[0].clientY - dragStartY;
            }
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isDragging = false;
            lastTouchDistance = 0;
        });
        
        // Mouse events for desktop
        canvas.addEventListener('mousedown', (e) => {
            const pos = getEventPos(e);
            const node = findNodeAt(pos.x, pos.y);
            if (node) {
                showInfo(node);
            } else {
                isDragging = true;
                dragStartX = e.clientX - offsetX;
                dragStartY = e.clientY - offsetY;
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX = e.clientX - dragStartX;
                offsetY = e.clientY - dragStartY;
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale *= delta;
            scale = Math.max(0.5, Math.min(3, scale));
        });
        
        function showInfo(node) {
            const panel = document.getElementById('infoPanel');
            document.getElementById('infoTitle').textContent = node.label.replace('\n', ' ');
            document.getElementById('infoDesc').textContent = node.desc;
            
            const list = document.getElementById('infoList');
            list.innerHTML = '';
            if (node.details) {
                node.details.forEach(detail => {
                    const li = document.createElement('li');
                    li.textContent = detail;
                    list.appendChild(li);
                });
            }
            
            panel.classList.remove('hidden');
        }
        
        function closeInfo() {
            document.getElementById('infoPanel').classList.add('hidden');
        }
    </script>
</body>
</html>
