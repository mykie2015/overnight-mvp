<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Intent Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: white;
            overflow-x: hidden;
        }
        
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }
        
        h1 {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .tagline {
            font-size: 2em;
            color: #a0aec0;
            text-align: center;
            margin-bottom: 60px;
        }
        
        #canvas {
            width: 100%;
            max-width: 900px;
            height: 500px;
            border-radius: 20px;
            background: linear-gradient(135deg, #1a1f3a 0%, #2d3561 100%);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            margin-bottom: 60px;
        }
        
        .value {
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 60px;
            line-height: 1.6;
        }
        
        .value strong {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            margin-bottom: 80px;
        }
        
        .stat {
            text-align: center;
            padding: 40px 20px;
            background: rgba(26, 31, 58, 0.5);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .stat:hover {
            transform: translateY(-10px);
            border-color: rgba(102, 126, 234, 0.8);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
        }
        
        .stat-value {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        
        .stat-label {
            font-size: 1.2em;
            color: #a0aec0;
        }
        
        .cta {
            text-align: center;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 60px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.5em;
            box-shadow: 0 15px 40px rgba(102,126,234,0.4);
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(102,126,234,0.6);
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            .tagline { font-size: 1.5em; }
            #canvas { height: 350px; }
            .value { font-size: 1.8em; }
            .stats { grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .stat { padding: 30px 15px; }
            .stat-value { font-size: 3em; }
            .btn { padding: 20px 40px; font-size: 1.2em; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Intent Engine</h1>
        <p class="tagline">Intent → Agent in 5 Minutes</p>
        
        <canvas id="canvas"></canvas>
        
        <div class="value">
            Write <strong>intent</strong>. Get <strong>agent</strong>. Ship <strong>fast</strong>.
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value">1</div>
                <div class="stat-label">Command</div>
            </div>
            <div class="stat">
                <div class="stat-value">5min</div>
                <div class="stat-label">Build</div>
            </div>
            <div class="stat">
                <div class="stat-value">7</div>
                <div class="stat-label">Guardrails</div>
            </div>
            <div class="stat">
                <div class="stat-value">100%</div>
                <div class="stat-label">Preserved</div>
            </div>
        </div>
        
        <div class="cta">
            <a href="https://github.com/mykie2015/overnight-mvp" class="btn">View on GitHub</a>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        resize();
        window.addEventListener('resize', resize);
        
        const stages = [
            { name: 'INTENT', emoji: '📝', color: '#10b981' },
            { name: 'VALIDATE', emoji: '✅', color: '#f59e0b' },
            { name: 'COMPILE', emoji: '⚙️', color: '#3b82f6' },
            { name: 'AGENT', emoji: '🚀', color: '#667eea' }
        ];
        
        let rotation = 0;
        let isDragging = false;
        let lastX = 0;
        
        function project(x, y, z) {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            const cx = w / 2;
            const cy = h / 2;
            const d = 400;
            
            const cos = Math.cos(rotation);
            const sin = Math.sin(rotation);
            const x1 = x * cos - z * sin;
            const z1 = x * sin + z * cos;
            
            const p = d / (d + z1);
            return { x: cx + x1 * p, y: cy + y * p, z: z1, s: p };
        }
        
        function drawBox(x, y, z, size, color, emoji, name) {
            const s = size / 2;
            const corners = [
                project(x-s, y-s, z-s), project(x+s, y-s, z-s),
                project(x+s, y+s, z-s), project(x-s, y+s, z-s),
                project(x-s, y-s, z+s), project(x+s, y-s, z+s),
                project(x+s, y+s, z+s), project(x-s, y+s, z+s)
            ];
            
            const faces = [
                { pts: [4,5,6,7], z: corners[4].z },
                { pts: [0,1,2,3], z: corners[0].z },
                { pts: [1,5,6,2], z: corners[1].z },
                { pts: [0,4,7,3], z: corners[0].z }
            ];
            
            faces.sort((a,b) => a.z - b.z);
            
            faces.forEach((f, i) => {
                const b = 0.5 + (i / faces.length) * 0.5;
                ctx.fillStyle = color + Math.floor(b * 255).toString(16).padStart(2, '0');
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                f.pts.forEach((p, j) => {
                    if (j === 0) ctx.moveTo(corners[p].x, corners[p].y);
                    else ctx.lineTo(corners[p].x, corners[p].y);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });
            
            const c = project(x, y, z);
            if (c.z > 0) {
                ctx.fillStyle = 'white';
                ctx.font = `${40 * c.s}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(emoji, c.x, c.y - 20 * c.s);
                ctx.font = `bold ${16 * c.s}px sans-serif`;
                ctx.fillText(name, c.x, c.y + 20 * c.s);
            }
        }
        
        function drawArrow(x1, y1, z1, x2, y2, z2) {
            const p1 = project(x1, y1, z1);
            const p2 = project(x2, y2, z2);
            if (p1.z > 0 && p2.z > 0) {
                const g = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
                g.addColorStop(0, 'rgba(102,126,234,0.6)');
                g.addColorStop(1, 'rgba(118,75,162,0.6)');
                ctx.strokeStyle = g;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                
                const a = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                const sz = 12;
                ctx.fillStyle = 'rgba(118,75,162,0.8)';
                ctx.beginPath();
                ctx.moveTo(p2.x, p2.y);
                ctx.lineTo(p2.x - sz * Math.cos(a - Math.PI/6), p2.y - sz * Math.sin(a - Math.PI/6));
                ctx.lineTo(p2.x - sz * Math.cos(a + Math.PI/6), p2.y - sz * Math.sin(a + Math.PI/6));
                ctx.closePath();
                ctx.fill();
            }
        }
        
        function draw() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, w, h);
            
            const sp = 180;
            const sx = -(stages.length - 1) * sp / 2;
            
            for (let i = 0; i < stages.length - 1; i++) {
                drawArrow(sx + i * sp + 40, 0, 0, sx + (i+1) * sp - 40, 0, 0);
            }
            
            stages.forEach((s, i) => {
                drawBox(sx + i * sp, 0, 0, 80, s.color, s.emoji, s.name);
            });
            
            const t = Date.now() / 1000;
            for (let i = 0; i < 7; i++) {
                const ang = (i / 7) * Math.PI * 2 + t * 0.5;
                const r = 250;
                const gx = Math.cos(ang) * r;
                const gz = Math.sin(ang) * r;
                const gy = Math.sin(t * 2 + i) * 30;
                const p = project(gx, gy, gz);
                if (p.z > 0) {
                    const sz = 12 * p.s;
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.font = `bold ${sz * 0.7}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText((i+1).toString(), p.x, p.y);
                }
            }
        }
        
        function animate() {
            if (!isDragging) rotation += 0.005;
            draw();
            requestAnimationFrame(animate);
        }
        animate();
        
        canvas.addEventListener('mousedown', e => {
            isDragging = true;
            lastX = e.clientX;
        });
        
        canvas.addEventListener('mousemove', e => {
            if (isDragging) {
                rotation += (e.clientX - lastX) * 0.01;
                lastX = e.clientX;
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('touchstart', e => {
            isDragging = true;
            lastX = e.touches[0].clientX;
        });
        
        canvas.addEventListener('touchmove', e => {
            if (isDragging) {
                rotation += (e.touches[0].clientX - lastX) * 0.01;
                lastX = e.touches[0].clientX;
            }
        });
        
        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
