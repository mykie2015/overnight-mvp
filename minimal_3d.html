<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Intent Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            font-size: 3em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tagline {
            text-align: center;
            font-size: 1.5em;
            color: #a0aec0;
            margin-bottom: 60px;
        }
        
        #canvas {
            display: block;
            width: 100%;
            max-width: 800px;
            height: 400px;
            margin: 0 auto 40px;
            border-radius: 20px;
            background: linear-gradient(135deg, #1a1f3a 0%, #2d3561 100%);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .message {
            text-align: center;
            font-size: 1.8em;
            line-height: 1.6;
            color: white;
            margin-bottom: 40px;
        }
        
        .message strong {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat {
            text-align: center;
            padding: 30px;
            background: rgba(26, 31, 58, 0.5);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        
        .stat:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(26, 31, 58, 0.8);
        }
        
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 1em;
            color: #a0aec0;
        }
        
        .cta {
            text-align: center;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 50px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.3em;
            margin: 10px;
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
            transition: all 0.3s ease;
        }
        
        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102,126,234,0.6);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .tagline {
                font-size: 1.2em;
                margin-bottom: 40px;
            }
            
            #canvas {
                height: 300px;
            }
            
            .message {
                font-size: 1.3em;
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .stat {
                padding: 20px;
            }
            
            .stat-value {
                font-size: 2em;
            }
            
            .cta-button {
                padding: 15px 30px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Intent Engine</h1>
        <p class="tagline">Intent → Agent in 5 Minutes</p>
        
        <canvas id="canvas"></canvas>
        
        <div class="message">
            Write <strong>intent</strong>. Get <strong>production agent</strong>. Zero coding.
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value">1</div>
                <div class="stat-label">Command</div>
            </div>
            <div class="stat">
                <div class="stat-value">5min</div>
                <div class="stat-label">Build Time</div>
            </div>
            <div class="stat">
                <div class="stat-value">7</div>
                <div class="stat-label">Guardrails</div>
            </div>
            <div class="stat">
                <div class="stat-value">100%</div>
                <div class="stat-label">Preserved</div>
            </div>
        </div>
        
        <div class="cta">
            <a href="https://github.com/mykie2015/overnight-mvp" class="cta-button">View on GitHub</a>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const stages = [
            { name: 'INTENT', emoji: '📝', color: '#10b981' },
            { name: 'VALIDATE', emoji: '✅', color: '#f59e0b' },
            { name: 'COMPILE', emoji: '⚙️', color: '#3b82f6' },
            { name: 'AGENT', emoji: '🚀', color: '#667eea' }
        ];
        
        let rotation = 0;
        
        function project3D(x, y, z) {
            const centerX = canvas.width / window.devicePixelRatio / 2;
            const centerY = canvas.height / window.devicePixelRatio / 2;
            const distance = 400;
            
            const cos = Math.cos(rotation);
            const sin = Math.sin(rotation);
            const x1 = x * cos - z * sin;
            const z1 = x * sin + z * cos;
            
            const perspective = distance / (distance + z1);
            const screenX = centerX + x1 * perspective;
            const screenY = centerY + y * perspective;
            
            return { x: screenX, y: screenY, z: z1, scale: perspective };
        }
        
        function drawBox(x, y, z, size, color, emoji, name) {
            const s = size / 2;
            const corners = [
                project3D(x - s, y - s, z - s),
                project3D(x + s, y - s, z - s),
                project3D(x + s, y + s, z - s),
                project3D(x - s, y + s, z - s),
                project3D(x - s, y - s, z + s),
                project3D(x + s, y - s, z + s),
                project3D(x + s, y + s, z + s),
                project3D(x - s, y + s, z + s)
            ];
            
            const faces = [
                { points: [4, 5, 6, 7], z: corners[4].z },
                { points: [0, 1, 2, 3], z: corners[0].z },
                { points: [1, 5, 6, 2], z: corners[1].z },
                { points: [0, 4, 7, 3], z: corners[0].z }
            ];
            
            faces.sort((a, b) => a.z - b.z);
            
            faces.forEach((face, i) => {
                const brightness = 0.5 + (i / faces.length) * 0.5;
                ctx.fillStyle = color + Math.floor(brightness * 255).toString(16).padStart(2, '0');
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                face.points.forEach((p, j) => {
                    if (j === 0) ctx.moveTo(corners[p].x, corners[p].y);
                    else ctx.lineTo(corners[p].x, corners[p].y);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });
            
            const center = project3D(x, y, z);
            if (center.z > 0) {
                ctx.fillStyle = 'white';
                ctx.font = `${40 * center.scale}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(emoji, center.x, center.y - 20 * center.scale);
                
                ctx.font = `bold ${16 * center.scale}px sans-serif`;
                ctx.fillText(name, center.x, center.y + 20 * center.scale);
            }
        }
        
        function drawArrow(x1, y1, z1, x2, y2, z2) {
            const p1 = project3D(x1, y1, z1);
            const p2 = project3D(x2, y2, z2);
            
            if (p1.z > 0 && p2.z > 0) {
                const gradient = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
                gradient.addColorStop(0, 'rgba(102, 126, 234, 0.6)');
                gradient.addColorStop(1, 'rgba(118, 75, 162, 0.6)');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                
                const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                const arrowSize = 12;
                ctx.fillStyle = 'rgba(118, 75, 162, 0.8)';
                ctx.beginPath();
                ctx.moveTo(p2.x, p2.y);
                ctx.lineTo(
                    p2.x - arrowSize * Math.cos(angle - Math.PI / 6),
                    p2.y - arrowSize * Math.sin(angle - Math.PI / 6)
                );
                ctx.lineTo(
                    p2.x - arrowSize * Math.cos(angle + Math.PI / 6),
                    p2.y - arrowSize * Math.sin(angle + Math.PI / 6)
                );
                ctx.closePath();
                ctx.fill();
            }
        }
        
        function draw() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            
            ctx.clearRect(0, 0, w, h);
            
            const spacing = 180;
            const startX = -(stages.length - 1) * spacing / 2;
            
            for (let i = 0; i < stages.length - 1; i++) {
                const x1 = startX + i * spacing;
                const x2 = startX + (i + 1) * spacing;
                drawArrow(x1 + 40, 0, 0, x2 - 40, 0, 0);
            }
            
            stages.forEach((stage, i) => {
                const x = startX + i * spacing;
                drawBox(x, 0, 0, 80, stage.color, stage.emoji, stage.name);
            });
            
            const time = Date.now() / 1000;
            for (let i = 0; i < 7; i++) {
                const angle = (i / 7) * Math.PI * 2 + time * 0.5;
                const radius = 250;
                const gx = Math.cos(angle) * radius;
                const gz = Math.sin(angle) * radius;
                const gy = Math.sin(time * 2 + i) * 30;
                
                const p = project3D(gx, gy, gz);
                if (p.z > 0) {
                    const size = 12 * p.scale;
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.font = `bold ${size * 0.7}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText((i + 1).toString(), p.x, p.y);
                }
            }
        }
        
        function animate() {
            rotation += 0.005;
            draw();
            requestAnimationFrame(animate);
        }
        animate();
        
        let isDragging = false;
        let lastX = 0;
        
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                rotation += (e.clientX - lastX) * 0.01;
                lastX = e.clientX;
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastX = e.touches[0].clientX;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            if (isDragging) {
                rotation += (e.touches[0].clientX - lastX) * 0.01;
                lastX = e.touches[0].clientX;
            }
        });
        
        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
